<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tidslinjal — Key Terrain Board</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16" type="image/x-icon">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/static/style.css">
<style>
/* Theme classes match main style.css: no class = dark (default),
   light-mode, city-camo, urban-camo */
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }

/* ── Top bar ── */
.top-bar { display:flex; align-items:center; gap:8px; padding:6px 12px; background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0; }
.top-bar .title { font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.05em; flex:1; }
.top-bar button { background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:4px 12px; cursor:pointer; font-size:12px; }
.top-bar button:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.top-bar .url-bar { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--text-dim); }
.top-bar .url-bar input { background:var(--bg3); border:1px solid var(--border); border-radius:3px; color:var(--text); padding:2px 6px; font-size:10px; font-family:monospace; width:220px; }

/* ── Board content area ── */
.kt-page-content { flex:1; overflow:auto; padding:16px; }

/* ── Standalone overrides: no modal overlay needed ── */
.modal-overlay { position:static !important; background:none !important; display:block !important; }
.modal { box-shadow:none !important; max-width:100% !important; width:100% !important; max-height:none !important; padding:0 !important; overflow:visible !important; }

/* ── Sub-modals (edit entry, settings, etc.) need visible borders ── */
.modal-overlay .modal-overlay { position:fixed !important; background:rgba(0,0,0,.5) !important; display:flex !important; align-items:center; justify-content:center; inset:0; z-index:10000; }
.modal-overlay .modal-overlay .modal {
  box-shadow:0 8px 32px rgba(0,0,0,.3) !important;
  border:1px solid var(--border) !important;
  border-radius:8px !important;
  max-width:600px !important;
  width:auto !important;
  max-height:90vh !important;
  overflow:auto !important;
  padding:20px !important;
  background:var(--bg2) !important;
}
</style>
</head>
<body>
<div class="top-bar">
  <span class="title">🏔️ Key Terrain Board</span>
  <div class="url-bar">
    <span>URL:</span>
    <input id="ktPageURL" readonly>
    <button id="ktPageCopyURL" title="Copy URL">Copy</button>
  </div>
  <button id="btnRefresh" title="Refresh data">🔄 Refresh</button>
</div>
<div id="notification-area" style="position:fixed;top:10px;right:10px;z-index:9999"></div>
<div class="kt-page-content" id="ktPageRoot"></div>

<!-- Core dependencies (order matters) -->
<script src="/static/i18n.js"></script>
<script src="/static/lang/en.js"></script>
<script src="/static/utils.js"></script>
<script src="/static/state.js"></script>
<script src="/static/api.js"></script>
<script src="/static/modals.js"></script>
<script src="/static/key-terrain.js"></script>

<!-- Standalone bootstrap -->
<script src="/static/key-terrain-popup.js"></script>
</body>
</html>
