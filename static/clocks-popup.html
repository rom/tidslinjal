<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tidslinjal — Clocks</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16" type="image/x-icon">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/static/vendor/seven-segment.css?v=8">
<style>
/* ── Theme application ── */
body.theme-dark  { --bg:#1a1d23; --bg2:#22262e; --bg3:#2a2e38; --text:#e8eaf0; --text-dim:#9098b0; --accent:#4a9eff; --border:#2e3340; --danger:#e05252; --success:#2ecc71; }
body.theme-light { --bg:#f0f2f5; --bg2:#ffffff; --bg3:#e8eaf0; --text:#1a1d23; --text-dim:#666; --accent:#1a6ed8; --border:#d0d4de; --danger:#c0392b; --success:#27ae60; }
body.theme-city-camo { --bg:#2b3325; --bg2:#333d2c; --bg3:#3a4532; --text:#d4dbc0; --text-dim:#8d9a78; --accent:#8fb85c; --border:#404d34; --danger:#e05252; --success:#2ecc71; }
body.theme-urban-camo { --bg:#1a2233; --bg2:#1e293b; --bg3:#243044; --text:#c8d8e8; --text-dim:#7a90a8; --accent:#4a90d9; --border:#3a4a5c; --danger:#e05252; --success:#2ecc71; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; min-height:100vh; gap:16px; padding:16px; }
/* ── Redesigned Header ── */
.header-bar { width:100%; max-width:800px; background:var(--bg2); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.header-top { display:flex; align-items:center; justify-content:space-between; padding:8px 14px; border-bottom:1px solid var(--border); }
.header-title { font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; }
.header-gear { background:none; border:none; color:var(--text-dim); font-size:16px; cursor:pointer; padding:2px 6px; border-radius:4px; }
.header-gear:hover { background:var(--bg3); color:var(--text); }
.header-gear.active { color:var(--accent); }
.settings-panel { display:none; padding:10px 14px; }
.settings-panel.open { display:block; }
.settings-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.settings-row:last-child { margin-bottom:0; }
.settings-row-label { font-size:11px; color:var(--text-dim); min-width:50px; font-weight:600; }
/* ── Toolbar (kept for backward compat) ── */
.toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--bg2);
  border:1px solid var(--border); border-radius:10px; padding:8px 14px; width:100%; max-width:600px; }
.toolbar label { font-size:11px; color:var(--text-dim); }
.toolbar select, .toolbar input[type=range] { background:var(--bg3); border:1px solid var(--border);
  border-radius:5px; color:var(--text); padding:3px 6px; font-size:11px; }
.toolbar input[type=range] { width:80px; cursor:pointer; }
.btn-tb { background:var(--bg3); border:1px solid var(--border); border-radius:5px; color:var(--text);
  padding:3px 10px; font-size:11px; cursor:pointer; }
.btn-tb:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-tb.active { background:var(--accent); color:#fff; border-color:var(--accent); }
/* ── Clock cards ── */
.clocks-wrap { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; width:100%; max-width:800px; }
.clock-card { background:var(--bg2); border:1px solid var(--border); border-radius:12px;
  padding:16px 24px 14px; text-align:center; position:relative; min-width:180px; transition:box-shadow .2s; }
.clock-card:hover { box-shadow:0 0 0 2px var(--accent); }
.clock-label { font-size:11px; font-weight:700; color:var(--accent); letter-spacing:.1em;
  text-transform:uppercase; margin-bottom:6px; }
.clock-time { font-weight:700; letter-spacing:.04em; font-variant-numeric:tabular-nums; line-height:1.1; }
.clock-date { font-size:11px; color:var(--text-dim); margin-top:4px; }
.clock-tz { font-size:11px; font-weight:700; color:var(--accent); margin-top:2px; }
/* ── Size variants ── */
.sz-xs .clock-time { font-size:28px; } .sz-xs .clock-card { padding:10px 16px 8px; min-width:130px; }
.sz-sm .clock-time { font-size:38px; } .sz-sm .clock-card { padding:12px 20px 10px; min-width:160px; }
.sz-md .clock-time { font-size:52px; }
.sz-lg .clock-time { font-size:72px; } .sz-lg .clock-card { padding:20px 32px 18px; min-width:240px; }
.sz-xl .clock-time { font-size:96px; } .sz-xl .clock-card { padding:24px 40px 22px; min-width:300px; }
.sz-xxl .clock-time { font-size:140px; } .sz-xxl .clock-card { padding:32px 52px 28px; min-width:400px; }
/* VCR mode gets larger sizing for boldness */
.sz-xs .vcr-time { font-size:34px; }
.sz-sm .vcr-time { font-size:46px; }
.sz-md .vcr-time { font-size:62px; }
.sz-lg .vcr-time { font-size:86px; }
.sz-xl .vcr-time { font-size:110px; }
.sz-xxl .vcr-time { font-size:160px; }
/* ── Analog clock ── */
.analog-wrap { width:120px; height:120px; margin:0 auto 4px; }
.analog-face { width:100%; height:100%; }
.sz-lg .analog-wrap { width:160px; height:160px; }
.sz-xl .analog-wrap { width:200px; height:200px; }
.sz-xxl .analog-wrap { width:280px; height:280px; }
/* ── Remove button ── */
.clock-remove { position:absolute; top:6px; right:8px; background:none; border:none;
  color:var(--text-dim); font-size:15px; cursor:pointer; line-height:1; padding:2px 5px;
  border-radius:4px; }
.clock-remove:hover { background:var(--danger); color:#fff; }
/* ── Style: minimal ── */
.style-minimal .clock-card { background:transparent; border-color:transparent; box-shadow:none; }
.style-minimal .clock-card:hover { box-shadow:0 0 0 1px var(--border); }
/* ── Style: compact ── */
.style-compact .clock-card { padding:8px 14px 6px; min-width:120px; }
.style-compact .clock-time { font-size:28px!important; }
.style-compact .clock-label { font-size:10px; }
/* ── Header row ── */
.page-header { font-size:11px; color:var(--text-dim); letter-spacing:.12em; text-transform:uppercase; }
/* ── VCR mode ── */
.vcr-card { background:#050000 !important; border-color:var(--vcr-border,#3a0000) !important; }
.vcr-time {
  color:var(--vcr-fg,#ff2200); text-shadow:0 0 10px var(--vcr-glow1,rgba(255,40,0,.95)),0 0 24px var(--vcr-glow2,rgba(255,0,0,.6)),0 0 48px var(--vcr-glow2,rgba(255,0,0,.25));
  font-weight:900; letter-spacing:.12em; transform:scale(1.15); transform-origin:center; }
.vcr-time .vcr-ghost {
  position:absolute; top:0; left:0; right:0;
  color:var(--vcr-ghost,rgba(255,34,0,.15)); pointer-events:none; }
.vcr-label { color:var(--vcr-dim,#aa2200) !important; font-weight:700; text-shadow:0 0 6px var(--vcr-glow2,rgba(255,0,0,.3)); }
.vcr-date  { color:var(--vcr-dim2,#882200) !important; font-weight:600; font-size:13px; text-shadow:0 0 4px var(--vcr-glow2,rgba(255,0,0,.2)); }
.vcr-tz    { color:var(--vcr-dim,#aa2200) !important; font-weight:700; text-shadow:0 0 6px var(--vcr-glow2,rgba(255,0,0,.3)); }
/* VCR color presets */
body.vcr-red    { --vcr-fg:#ff2200; --vcr-glow1:rgba(255,40,0,.9); --vcr-glow2:rgba(255,0,0,.5); --vcr-ghost:rgba(255,34,0,.12); --vcr-dim:#880000; --vcr-dim2:#660000; --vcr-border:#3a0000; }
body.vcr-green  { --vcr-fg:#33ff33; --vcr-glow1:rgba(50,255,50,.9); --vcr-glow2:rgba(0,200,0,.5); --vcr-ghost:rgba(50,255,50,.12); --vcr-dim:#008800; --vcr-dim2:#006600; --vcr-border:#003a00; }
body.vcr-blue   { --vcr-fg:#44aaff; --vcr-glow1:rgba(68,170,255,.9); --vcr-glow2:rgba(0,100,255,.5); --vcr-ghost:rgba(68,170,255,.12); --vcr-dim:#004488; --vcr-dim2:#003366; --vcr-border:#002244; }
body.vcr-orange { --vcr-fg:#ff8800; --vcr-glow1:rgba(255,136,0,.9); --vcr-glow2:rgba(255,100,0,.5); --vcr-ghost:rgba(255,136,0,.12); --vcr-dim:#885500; --vcr-dim2:#664400; --vcr-border:#3a2200; }
.vcr-colon { display:inline-block; animation:vcr-blink 1s step-start infinite; }
@keyframes vcr-blink { 50% { opacity:0; } }
/* ── Synthetic clock card ── */
.synth-card { background:#1a0508 !important; border-color:#5c1a1a !important; }
.synth-card .clock-label { color:#ff4444 !important; }
.synth-card .clock-time { color:#ff4444 !important; text-shadow:0 0 8px rgba(255,68,68,.6); }
.synth-card .clock-tz { color:#cc3333 !important; }
.synth-card .clock-date { color:#aa3333 !important; }
.synth-card.vcr-card { background:#0a0000 !important; border-color:#4a0000 !important; }
.synth-card .vcr-time { color:#ff4444 !important; text-shadow:0 0 10px rgba(255,68,68,.9),0 0 24px rgba(255,0,0,.6),0 0 48px rgba(255,0,0,.25) !important; }
.synth-card .vcr-label { color:#cc3333 !important; text-shadow:0 0 6px rgba(255,0,0,.3) !important; }
.synth-card .vcr-tz { color:#cc3333 !important; text-shadow:0 0 6px rgba(255,0,0,.3) !important; }
.synth-card .vcr-date { color:#993333 !important; text-shadow:0 0 4px rgba(255,0,0,.2) !important; }
/* ── Countdown cards ── */
.countdown-card { position:relative; background:color-mix(in srgb, var(--accent) 8%, var(--bg2)); border-color:color-mix(in srgb, var(--accent) 25%, var(--border)); }
.timer-card { position:relative; background:color-mix(in srgb, #2ecc71 8%, var(--bg2)); border-color:color-mix(in srgb, #2ecc71 25%, var(--border)); }
.countdown-time { font-variant-numeric:tabular-nums; line-height:1.1; }
.countdown-controls { display:flex; gap:4px; margin-top:6px; justify-content:center; }
.countdown-controls button { background:var(--bg3); border:1px solid var(--border); border-radius:5px;
  color:var(--text); padding:2px 8px; font-size:10px; cursor:pointer; }
.countdown-controls button:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.cd-expired { animation: cd-flash 1s ease-in-out infinite; }
@keyframes cd-flash {
  0%,100% { box-shadow:0 0 0 2px var(--danger,#e05252); }
  50% { box-shadow:0 0 16px 4px var(--danger,#e05252); }
}
.cd-expired .clock-time, .cd-expired .vcr-time { color:var(--danger,#e05252) !important; }
.cd-counting-up .clock-label { color:var(--danger,#e05252) !important; }
.cd-paused .clock-time, .cd-paused .vcr-time { animation: cd-paused-blink 1.2s step-end infinite; }
@keyframes cd-paused-blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
/* ── VCR segment overrides for visibility ── */
.vcr-time .seg7 i.off { opacity: 0.12; }
.vcr-time .seg7 i { transition: none; }
/* ── Clickable label ── */
.clock-label-click { cursor:pointer; user-select:none; }
.clock-label-click:hover { text-decoration:underline; }
/* ── Timer progress bar ── */
.timer-progress { width:90%; height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; margin:6px auto 2px; border:1px solid var(--border); cursor:ns-resize; }
.timer-progress-bar { height:100%; background:#2ecc71; transition:width .5s,background .3s; border-radius:3px; pointer-events:none; }
.timer-overtime .timer-progress-bar { background:var(--danger,#e05252); }
/* ── Lap time history ── */
.lap-list { font-size:10px; color:var(--text-dim); max-height:80px; overflow-y:auto; margin:4px auto 0; width:90%; text-align:left; }
.lap-list .lap-row { display:flex; justify-content:space-between; padding:1px 0; border-bottom:1px solid var(--border); }
.lap-list .lap-row:last-child { border-bottom:none; }
.lap-list .lap-num { color:var(--accent); min-width:28px; }
.lap-list .lap-split { color:var(--text); font-variant-numeric:tabular-nums; }
.lap-list .lap-total { color:var(--text-dim); font-variant-numeric:tabular-nums; }
.lap-export-row { display:flex; gap:4px; justify-content:center; margin-top:3px; }
.lap-export-row button { background:var(--bg3); border:1px solid var(--border); border-radius:4px; color:var(--text-dim); padding:1px 6px; font-size:9px; cursor:pointer; }
.lap-export-row button:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
/* ── Color picker row ── */
.color-row { display:flex; align-items:center; gap:4px; }
.color-row label { font-size:9px; color:var(--text-dim); min-width:16px; }
.color-row input[type=color] { width:18px; height:16px; border:1px solid var(--border); border-radius:3px; background:var(--bg3); cursor:pointer; padding:0; }
/* ── Per-clock color pickers ── */
.card-color-pickers { position:absolute; top:3px; left:3px; display:flex; gap:1px; opacity:0; transition:opacity .2s; z-index:5; }
.clock-card:hover .card-color-pickers { opacity:1; }
.card-color-pickers input[type=color] { width:12px; height:12px; border:1px solid var(--border); border-radius:2px; cursor:pointer; padding:0; background:var(--bg3); }
/* ── Country flag background ── */
.clock-card[data-flag-bg]::before { content:attr(data-flag-bg); position:absolute; font-size:80px; opacity:0.08; top:50%; left:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:0; }
.clock-card[data-flag-bg] > * { position:relative; z-index:1; }
.flag-toggle { position:absolute; bottom:4px; right:6px; background:none; border:none; color:var(--text-dim); font-size:10px; cursor:pointer; opacity:0; transition:opacity .2s; border-radius:3px; padding:1px 4px; }
.clock-card:hover .flag-toggle { opacity:0.7; }
.flag-toggle:hover { opacity:1 !important; background:var(--bg3); }
/* ── Pulsing frame border for expired ── */
.pulse-frame { --pulse-color:var(--danger,#e05252); animation:pulse-border 1.5s ease-in-out infinite; }
@keyframes pulse-border {
  0%,100% { box-shadow:0 0 0 2px var(--pulse-color), inset 0 0 4px rgba(0,0,0,0); }
  50% { box-shadow:0 0 12px 4px var(--pulse-color), inset 0 0 8px color-mix(in srgb, var(--pulse-color) 20%, transparent); }
}
/* ── Dragging ── */
.clock-card.dragging { opacity:0.6; transform:scale(0.95); cursor:grabbing; }
.clock-card { cursor:grab; }
/* ── Pin icon ── */
.pin-icon { position:absolute; top:6px; left:28px; background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; padding:2px 4px; border-radius:3px; opacity:0; transition:opacity .2s; }
.clock-card:hover .pin-icon { opacity:0.7; }
.pin-icon:hover { opacity:1 !important; background:var(--bg3); color:var(--accent); }
.pin-dropdown { position:absolute; top:22px; left:24px; background:var(--bg2); border:1px solid var(--border); border-radius:6px; padding:4px 0; z-index:20; min-width:140px; box-shadow:0 4px 16px rgba(0,0,0,.4); display:none; }
.pin-dropdown.show { display:block; }
.pin-dropdown button { display:block; width:100%; text-align:left; background:none; border:none; color:var(--text); padding:4px 10px; font-size:11px; cursor:pointer; }
.pin-dropdown button:hover { background:var(--bg3); color:var(--accent); }
/* ── Alarm cards ── */
.alarm-card { position:relative; background:color-mix(in srgb, #ff9500 8%, var(--bg2)); border-color:color-mix(in srgb, #ff9500 25%, var(--border)); }
.alarm-card .clock-label { color:#ff9500; }
.alarm-active { animation:alarm-pulse 0.8s ease-in-out infinite; --pulse-color:#ff9500; }
@keyframes alarm-pulse {
  0%,100% { box-shadow:0 0 0 2px #ff9500; }
  50% { box-shadow:0 0 20px 6px #ff9500; }
}
.alarm-past { animation:alarm-past-pulse 2s ease-in-out infinite; }
@keyframes alarm-past-pulse {
  0%,100% { box-shadow:0 0 0 2px #cc6600; }
  50% { box-shadow:0 0 12px 3px #cc6600; }
}
/* ── Narrative cards ── */
.narrative-card { position:relative; background:color-mix(in srgb, #9b59b6 10%, var(--bg2)); border-color:color-mix(in srgb, #9b59b6 30%, var(--border)); }
.narrative-card .clock-label { color:#9b59b6; }
.narrative-list { max-height:120px; overflow-y:auto; font-size:10px; text-align:left; margin:4px 0; }
.narrative-entry { padding:3px 0; border-bottom:1px solid var(--border); display:flex; gap:4px; align-items:baseline; }
.narrative-entry:last-child { border-bottom:none; }
.narrative-ts { color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
.narrative-icon { font-size:12px; }
.narrative-summary { color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* ── Phase cards ── */
.phase-card { position:relative; }
.phase-card .clock-label { font-size:12px; }
.phase-progress { width:90%; height:6px; background:var(--bg3); border-radius:3px; overflow:hidden; margin:6px auto 2px; border:1px solid var(--border); }
.phase-progress-bar { height:100%; transition:width .5s; border-radius:3px; }
/* ── F1 Start cards ── */
.f1-card { position:relative; background:color-mix(in srgb, #e74c3c 6%, var(--bg2)); border-color:color-mix(in srgb, #e74c3c 20%, var(--border)); min-width:220px; }
.f1-card .clock-label { color:#e74c3c; }
.f1-lights { display:flex; gap:8px; justify-content:center; margin:8px 0; }
.f1-light { width:24px; height:24px; border-radius:50%; background:#333; border:2px solid #555; transition:background .3s, box-shadow .3s; }
.f1-light.on { background:#e74c3c; box-shadow:0 0 12px 4px rgba(231,76,60,.6); }
.f1-light.go { background:#2ecc71; box-shadow:0 0 16px 6px rgba(46,204,113,.7); }
/* F1 light scaling */
.sz-xs .f1-light { width:16px; height:16px; } .sz-xs .f1-lights { gap:4px; }
.sz-sm .f1-light { width:20px; height:20px; } .sz-sm .f1-lights { gap:6px; }
.sz-md .f1-light { width:24px; height:24px; }
.sz-lg .f1-light { width:32px; height:32px; } .sz-lg .f1-lights { gap:10px; }
.sz-xl .f1-light { width:40px; height:40px; } .sz-xl .f1-lights { gap:12px; }
.sz-xxl .f1-light { width:56px; height:56px; } .sz-xxl .f1-lights { gap:16px; }
</style>
</head>
<body class="theme-dark sz-md">
<!-- ── Redesigned Header ── -->
<div class="header-bar" id="headerBar">
  <div class="header-top">
    <span class="header-title" id="headerTitle">TIDSLINJAL CLOCKS</span>
    <button class="header-gear" id="btnGear" title="Toggle settings panel">&#9881;</button>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-row">
      <span class="settings-row-label">Display</span>
      <select id="selStyle" class="btn-tb" style="padding:3px 6px">
        <option value="">Standard</option>
        <option value="style-minimal">Minimal</option>
        <option value="style-compact">Compact</option>
      </select>
      <button class="btn-tb active" id="btnDigital" data-mode="digital">Digital</button>
      <button class="btn-tb" id="btnAnalog" data-mode="analog">Analog</button>
      <button class="btn-tb" id="btnVCR" data-mode="vcr">VCR</button>
      <input type="range" id="sizeSlider" min="0" max="5" value="2" step="1" style="width:80px;cursor:pointer">
      <span id="sizeLbl" style="font-size:11px;color:var(--text-dim);min-width:18px">M</span>
    </div>
    <div class="settings-row">
      <span class="settings-row-label">Time</span>
      <button class="btn-tb active" id="btnTzLocal" data-tz="local">Local</button>
      <button class="btn-tb" id="btnTzZulu" data-tz="zulu">ZULU</button>
      <button class="btn-tb active" id="btnFmt24" data-fmt="24">24h</button>
      <button class="btn-tb" id="btnFmt12" data-fmt="12">12h</button>
      <label id="lblVcrColor" style="display:none;font-size:11px;color:var(--text-dim)">VCR Color</label>
      <select id="selVcrColor" style="display:none;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:3px 6px;font-size:11px">
        <option value="red">Red</option>
        <option value="green">Green</option>
        <option value="blue">Blue</option>
        <option value="orange">Orange</option>
      </select>
      <button class="btn-tb" id="btnDigits" title="Show hour numbers on analog face">1-12</button>
    </div>
    <div class="settings-row">
      <span class="settings-row-label">Add</span>
      <button class="btn-tb" id="btnAddCountdown" title="Add countdown timer">Countdown</button>
      <button class="btn-tb" id="btnAddTimer" title="Add stopwatch timer">Timer</button>
      <button class="btn-tb" id="btnAddAlarm" title="Add alarm clock">Alarm</button>
      <button class="btn-tb" id="btnAddPhase" title="Add phase clock">Phase</button>
      <button class="btn-tb" id="btnAddNarrative" title="Add narrative clock">Narrative</button>
      <button class="btn-tb" id="btnAddF1" title="Add F1 start clock">F1</button>
      <button class="btn-tb" id="btnAddSynth" title="Add synthetic exercise clock">Synthetic</button>
      <button class="btn-tb" id="btnAddBattleRhythm" title="Add battle rhythm clock (Key Terrain Board)">Battle Rhythm</button>
    </div>
    <div class="settings-row">
      <span class="settings-row-label">Colors</span>
      <span class="color-row">
        <label title="Background color">BG</label>
        <input type="color" id="colorBg" value="#1a1d23" title="Background color">
        <label title="Countdown color">CD</label>
        <input type="color" id="colorCountdown" value="#4a9eff" title="Countdown accent color">
        <label title="Timer color">TM</label>
        <input type="color" id="colorTimer" value="#2ecc71" title="Timer accent color">
        <label title="Alarm color">AL</label>
        <input type="color" id="colorAlarm" value="#ff9500" title="Alarm accent color">
      </span>
    </div>
  </div>
</div>
<!-- Hidden toolbar kept for backward compatibility / ID references -->
<div class="toolbar" id="toolbar" style="display:none">
  <label>Style</label>
  <label>Mode</label>
  <label>Size</label>
</div>
<div class="clocks-wrap" id="clocksWrap"></div>
<div class="clocks-wrap" id="countdownWrap"></div>
<div class="clocks-wrap" id="alarmWrap"></div>
<div class="clocks-wrap" id="timerWrap"></div>
<div class="clocks-wrap" id="narrativeWrap"></div>
<div class="clocks-wrap" id="phaseWrap"></div>
<div class="clocks-wrap" id="f1Wrap"></div>

<!-- Countdown setup popover -->
<div id="countdownPopover" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.5)">
  <div style="font-weight:700;color:var(--accent);margin-bottom:12px;font-size:14px">Add Countdown Timer</div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Label</label>
    <input type="text" id="cdLabel" placeholder="e.g. Briefing starts" maxlength="40"
      style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px">
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Countdown duration</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input type="number" id="cdHours" min="0" max="999" value="0" style="width:60px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;text-align:center">
      <span style="font-size:11px;color:var(--text-dim)">h</span>
      <input type="number" id="cdMinutes" min="0" max="59" value="30" style="width:60px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;text-align:center">
      <span style="font-size:11px;color:var(--text-dim)">m</span>
      <input type="number" id="cdSeconds" min="0" max="59" value="0" style="width:60px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;text-align:center">
      <span style="font-size:11px;color:var(--text-dim)">s</span>
    </div>
    <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">
      <button class="btn-tb cd-preset" data-m="15">15m</button>
      <button class="btn-tb cd-preset" data-m="30">30m</button>
      <button class="btn-tb cd-preset" data-m="45">45m</button>
      <button class="btn-tb cd-preset" data-h="1">1h</button>
      <button class="btn-tb cd-preset" data-h="2">2h</button>
      <button class="btn-tb cd-preset" data-h="4">4h</button>
    </div>
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="cdContinueUp" checked> Continue counting up after zero
    </label>
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="cdPlaySound" checked> Play sound alarm at zero
    </label>
    <div id="cdSoundRow" style="margin-top:4px;display:flex;align-items:center;gap:6px">
      <select id="cdSoundType" style="flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 8px;font-size:11px">
        <option value="beep">Beep (3x short)</option>
        <option value="klaxon">Klaxon</option>
        <option value="bell">Bell</option>
        <option value="siren">Siren</option>
        <option value="chime">Chime</option>
      </select>
      <button class="btn-tb" id="cdSoundPreview" style="font-size:10px;padding:2px 8px">Test</button>
    </div>
  </div>
  <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:14px">
    <button class="btn-tb" id="cdCancel">Cancel</button>
    <button class="btn-tb active" id="cdStart">Start Countdown</button>
  </div>
</div>
<div id="countdownOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>

<!-- Timer setup popover -->
<div id="timerPopover" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.5)">
  <div style="font-weight:700;color:var(--accent);margin-bottom:12px;font-size:14px">Add Stopwatch Timer</div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Label</label>
    <input type="text" id="tmrLabel" placeholder="e.g. Exercise duration" maxlength="40"
      style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px">
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Target duration (optional)</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input type="number" id="tmrHours" min="0" max="999" value="0" style="width:60px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;text-align:center">
      <span style="font-size:11px;color:var(--text-dim)">h</span>
      <input type="number" id="tmrMinutes" min="0" max="59" value="0" style="width:60px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;text-align:center">
      <span style="font-size:11px;color:var(--text-dim)">m</span>
      <input type="number" id="tmrSeconds" min="0" max="59" value="0" style="width:60px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;text-align:center">
      <span style="font-size:11px;color:var(--text-dim)">s</span>
    </div>
    <div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap">
      <button class="btn-tb tmr-preset" data-m="15">15m</button>
      <button class="btn-tb tmr-preset" data-m="30">30m</button>
      <button class="btn-tb tmr-preset" data-m="45">45m</button>
      <button class="btn-tb tmr-preset" data-h="1">1h</button>
      <button class="btn-tb tmr-preset" data-h="2">2h</button>
      <button class="btn-tb tmr-preset" data-h="4">4h</button>
    </div>
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="tmrContinueAfter" checked> Continue counting after reaching target
    </label>
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="tmrPlaySound" checked> Play sound alarm at target
    </label>
    <div id="tmrSoundRow" style="margin-top:4px;display:flex;align-items:center;gap:6px">
      <select id="tmrSoundType" style="flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 8px;font-size:11px">
        <option value="beep">Beep (3x short)</option>
        <option value="klaxon">Klaxon</option>
        <option value="bell">Bell</option>
        <option value="siren">Siren</option>
        <option value="chime">Chime</option>
      </select>
      <button class="btn-tb" id="tmrSoundPreview" style="font-size:10px;padding:2px 8px">Test</button>
    </div>
  </div>
  <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:14px">
    <button class="btn-tb" id="tmrCancel">Cancel</button>
    <button class="btn-tb active" id="tmrStart">Start Timer</button>
  </div>
</div>
<div id="timerOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>

<!-- Alarm setup popover -->
<div id="alarmPopover" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.5)">
  <div style="font-weight:700;color:#ff9500;margin-bottom:12px;font-size:14px">Add Alarm</div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Label</label>
    <input type="text" id="alLabel" placeholder="e.g. Phase 2 begins" maxlength="40"
      style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px">
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Mode</label>
    <select id="alMode" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px">
      <option value="absolute">Absolute time</option>
      <option value="epoch_relative">Relative to exercise epoch</option>
      <option value="relative_now">Relative to now</option>
    </select>
  </div>
  <div id="alAbsoluteRow" style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Target time</label>
    <input type="datetime-local" id="alTargetTime"
      style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px">
  </div>
  <div id="alRelativeRow" style="margin-bottom:8px;display:none">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Offset from epoch (e.g. +02:30 or -00:15)</label>
    <input type="text" id="alEpochOffset" placeholder="H+HH:MM or -HH:MM" maxlength="10"
      style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px">
  </div>
  <div id="alRelativeNowRow" style="margin-bottom:8px;display:none">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Time from now (e.g. 01:30 = 1h 30m)</label>
    <input type="text" id="alRelativeNowOffset" placeholder="HH:MM" maxlength="10"
      style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px">
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="alContinuePulse" checked> Continue pulsing after firing
    </label>
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="alPlaySound" checked> Play sound when alarm fires
    </label>
    <div id="alSoundRow" style="margin-top:4px;display:flex;align-items:center;gap:6px">
      <select id="alSoundType" style="flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:4px 8px;font-size:11px">
        <option value="beep">Beep</option>
        <option value="klaxon">Klaxon</option>
        <option value="bell">Bell</option>
        <option value="siren">Siren</option>
        <option value="chime">Chime</option>
      </select>
    </div>
  </div>
  <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:14px">
    <button class="btn-tb" id="alCancel">Cancel</button>
    <button class="btn-tb active" id="alStart">Add Alarm</button>
  </div>
</div>
<div id="alarmOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>

<!-- F1 Start popover -->
<div id="f1Popover" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.5)">
  <div style="font-weight:700;color:#e74c3c;margin-bottom:12px;font-size:14px">Add F1 Start Clock</div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Label</label>
    <input type="text" id="f1Label" placeholder="e.g. Exercise Start" maxlength="40"
      style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px">
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Number of lights (3-7)</label>
    <input type="number" id="f1NumLights" min="3" max="7" value="5"
      style="width:80px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;text-align:center">
  </div>
  <div style="margin-bottom:8px">
    <label style="font-size:11px;color:var(--text-dim);display:block;margin-bottom:3px">Countdown seconds before sequence</label>
    <input type="number" id="f1CountdownSec" min="3" max="30" value="10"
      style="width:80px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:5px 8px;font-size:12px;text-align:center">
  </div>
  <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:14px">
    <button class="btn-tb" id="f1Cancel">Cancel</button>
    <button class="btn-tb active" id="f1Start">Add F1 Clock</button>
  </div>
</div>
<div id="f1Overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99"></div>

<script src="/static/clocks-popup.js?v=8"></script>
</body>
</html>
