<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidslinjal — Map Projection</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16" type="image/x-icon">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="/static/vendor/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round">
<style>
/* ── Theme variables ── */
body.theme-dark  { --bg:#1a1d23; --bg2:#22262e; --bg3:#2a2e38; --text:#e8eaf0; --text-dim:#9098b0; --accent:#4a9eff; --border:#2e3340; --danger:#e05252; }
body.theme-light { --bg:#f0f2f5; --bg2:#ffffff; --bg3:#e8eaf0; --text:#1a1d23; --text-dim:#666; --accent:#1a6ed8; --border:#d0d4de; --danger:#c0392b; }
body.theme-city-camo { --bg:#2b3325; --bg2:#333d2c; --bg3:#3a4532; --text:#d4dbc0; --text-dim:#8d9a78; --accent:#8fb85c; --border:#404d34; --danger:#e05252; }
body.theme-urban-camo { --bg:#212630; --bg2:#282e3a; --bg3:#2f3644; --text:#c8d0e0; --text-dim:#7a88a0; --accent:#5c8abf; --border:#333d50; --danger:#e05252; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
  display:flex; flex-direction:column; height:100vh; overflow:hidden; }
/* ── Toolbar ── */
.map-toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; background:var(--bg2);
  border-bottom:1px solid var(--border); padding:6px 12px; flex-shrink:0; z-index:1000; }
.map-toolbar label { font-size:11px; color:var(--text-dim); }
.map-toolbar select, .map-toolbar input { background:var(--bg3); border:1px solid var(--border);
  border-radius:5px; color:var(--text); padding:3px 6px; font-size:11px; }
.btn-map { background:var(--bg3); border:1px solid var(--border); border-radius:5px; color:var(--text);
  padding:3px 10px; font-size:11px; cursor:pointer; }
.btn-map:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-map.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.page-header { font-size:11px; color:var(--text-dim); letter-spacing:.12em; text-transform:uppercase; }
/* ── Map container ── */
#mapProjection { flex:1; width:100%; }
/* ── PDF container (hidden by default) ── */
#pdfContainer { flex:1; width:100%; display:none; position:relative; }
#pdfContainer iframe { width:100%; height:100%; border:none; }
#pdfContainer .pdf-controls { position:absolute; top:8px; right:8px; z-index:10; display:flex; gap:4px; }
#pdfContainer .pdf-controls button { background:var(--bg2); border:1px solid var(--border); border-radius:4px; color:var(--text); padding:4px 10px; font-size:12px; cursor:pointer; }
#pdfContainer .pdf-controls button:hover { background:var(--accent); color:#fff; }
/* ── Legend panel ── */
.map-legend { position:absolute; bottom:24px; right:12px; z-index:1001; background:var(--bg2);
  border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:11px;
  max-height:200px; overflow-y:auto; min-width:150px; cursor:grab; user-select:none; }
.map-legend.dragging { cursor:grabbing; opacity:0.9; box-shadow:0 4px 16px rgba(0,0,0,0.3); }
.map-legend h4 { font-size:11px; color:var(--accent); margin-bottom:4px; letter-spacing:.08em; text-transform:uppercase; }
.legend-item { display:flex; align-items:center; gap:6px; padding:2px 0; }
.legend-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
/* ── Overlay layers panel ── */
.map-layers { position:absolute; top:60px; right:12px; z-index:1001; background:var(--bg2);
  border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:11px;
  max-height:300px; overflow-y:auto; min-width:180px; display:none; }
.map-layers.open { display:block; }
.map-layers h4 { font-size:11px; color:var(--accent); margin-bottom:4px; }
.layer-toggle { display:flex; align-items:center; gap:6px; padding:2px 0; cursor:pointer; }
.layer-toggle input { accent-color:var(--accent); }
/* ── File import overlay ── */
.import-overlay { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:1002; background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  padding:20px; text-align:center; min-width:300px; }
.import-overlay.open { display:block; }
.import-overlay input[type=file] { margin:10px 0; }
/* ── Overlay controls bar ── */
.overlay-controls { display:flex; align-items:center; gap:6px; }
.overlay-controls select { max-width:160px; }
/* ── Add Item Dialog ── */
.add-item-dialog { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:1003; background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  padding:20px; min-width:320px; }
.add-item-dialog.open { display:block; }
.add-item-dialog h4 { font-size:12px; color:var(--accent); margin-bottom:8px; text-transform:uppercase; letter-spacing:.08em; }
.add-item-dialog label { font-size:11px; color:var(--text-dim); display:block; margin-top:8px; margin-bottom:2px; }
.add-item-dialog select, .add-item-dialog input { width:100%; background:var(--bg3); border:1px solid var(--border);
  border-radius:5px; color:var(--text); padding:4px 8px; font-size:11px; }
.add-item-dialog .dialog-buttons { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
/* ── Map overlay item markers ── */
.map-overlay-item { background:transparent; border:none; }
/* ── Drawing toolbar ── */
.draw-toolbar { display:flex; gap:4px; align-items:center; padding:0 4px; }
.draw-toolbar .draw-btn { background:var(--bg3); border:1px solid var(--border); border-radius:4px;
  padding:2px 6px; font-size:12px; cursor:pointer; color:var(--text); }
.draw-toolbar .draw-btn:hover, .draw-toolbar .draw-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.draw-toolbar input[type="color"] { width:24px; height:22px; border:1px solid var(--border); border-radius:3px; padding:0; cursor:pointer; }
.draw-toolbar input[type="range"] { width:50px; height:16px; }
/* ── Upload map dialog ── */
.upload-map-dialog { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:1003; background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  padding:20px; min-width:340px; }
.upload-map-dialog.open { display:block; }
.upload-map-dialog h4 { font-size:12px; color:var(--accent); margin-bottom:8px; text-transform:uppercase; letter-spacing:.08em; }
.upload-map-dialog label { font-size:11px; color:var(--text-dim); display:block; margin-top:8px; margin-bottom:2px; }
.upload-map-dialog select, .upload-map-dialog input { width:100%; background:var(--bg3); border:1px solid var(--border);
  border-radius:5px; color:var(--text); padding:4px 8px; font-size:11px; }
.upload-map-dialog .dialog-buttons { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
/* ── New overlay dialog ── */
.new-overlay-dialog { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  z-index:1003; background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  padding:20px; min-width:300px; }
.new-overlay-dialog.open { display:block; }
.new-overlay-dialog h4 { font-size:12px; color:var(--accent); margin-bottom:8px; text-transform:uppercase; letter-spacing:.08em; }
.new-overlay-dialog label { font-size:11px; color:var(--text-dim); display:block; margin-top:8px; margin-bottom:2px; }
.new-overlay-dialog input { width:100%; background:var(--bg3); border:1px solid var(--border);
  border-radius:5px; color:var(--text); padding:4px 8px; font-size:11px; }
.new-overlay-dialog .dialog-buttons { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
</style>
</head>
<body class="theme-dark">
<div class="map-toolbar">
  <span class="page-header">Tidslinjal — Map Projection</span>
  <label id="lblMapSource">Map</label>
  <select id="mapSelector">
    <option value="">OpenStreetMap (Live)</option>
  </select>
  <label id="lblTileLayer">Tile Layer</label>
  <select id="selTileLayer">
    <option value="osm">OpenStreetMap</option>
    <option value="topo">Topographic</option>
    <option value="satellite">Satellite</option>
    <option value="dark">Dark</option>
  </select>
  <button class="btn-map" id="btnUploadMap" title="Upload a map file">Upload Map</button>
  <button class="btn-map" id="btnLayers" title="Toggle overlay layers">Layers</button>
  <button class="btn-map" id="btnImport" title="Import GeoJSON or KML file">Import</button>
  <button class="btn-map" id="btnMeetings" title="Show physical meetings">Meetings</button>
  <button class="btn-map" id="btnUsers" title="Show user locations">Users</button>
  <button class="btn-map" id="btnRooms" title="Show rooms">&#127968; Rooms</button>
  <button class="btn-map" id="btnBuildings" title="Show buildings">&#127970; Buildings</button>
  <button class="btn-map" id="btnComputers" title="Show computer services">&#128187; IT</button>
  <button class="btn-map" id="btnDataCenters" title="Show data centers">&#128421; DC</button>
  <button class="btn-map" id="btnFitAll" title="Fit all markers in view">Fit All</button>
  <button class="btn-map" id="btnGeoAddItem" title="Add item to geographical map">+ Add Item</button>
  <div class="overlay-controls" id="overlayControls" style="display:none">
    <select id="overlaySelector"><option value="">Select overlay...</option></select>
    <button class="btn-map" id="btnAddOverlay" title="New overlay">+</button>
    <button class="btn-map" id="btnLockOverlay" title="Lock/Unlock" style="display:none">Lock</button>
    <button class="btn-map" id="btnAddItem" title="Add resource to overlay">Add Item</button>
  </div>
  <span style="width:8px"></span>
  <!-- Drawing tools -->
  <div class="draw-toolbar" id="drawToolbar" style="display:none">
    <button class="draw-btn" id="btnDrawPen" title="Draw freehand">✏️</button>
    <button class="draw-btn" id="btnDrawLine" title="Draw line">╱</button>
    <button class="draw-btn" id="btnDrawRect" title="Draw rectangle">▭</button>
    <button class="draw-btn" id="btnDrawCircle" title="Draw circle">◯</button>
    <button class="draw-btn" id="btnDrawHighlight" title="Highlight area">🖍</button>
    <button class="draw-btn" id="btnDropNeedle" title="Drop pin/needle">📌</button>
    <button class="draw-btn" id="btnDropSymbol" title="Place symbol">🔣</button>
    <button class="draw-btn" id="btnDrawErase" title="Eraser">🧹</button>
    <button class="draw-btn" id="btnDrawUndo" title="Undo last drawing">↩</button>
    <input type="color" id="drawColor" value="#FF0000" title="Drawing color">
    <input type="range" id="drawWidth" min="1" max="12" value="3" title="Line width">
    <button class="draw-btn" id="btnDrawOff" title="Stop drawing">🚫</button>
  </div>
  <button class="btn-map" id="btnToggleDraw" title="Toggle drawing tools">🎨 Draw</button>
  <button class="btn-map" id="btnToggleLegend" title="Toggle legend">Legend</button>
  <button class="btn-map" id="btnLockMap" title="Lock/Unlock map" style="display:none">🔒 Lock</button>
  <span style="flex:1"></span>
  <input type="text" id="addressSearch" placeholder="Search address..." style="min-width:180px;flex:1;max-width:300px" title="Type an address to search and zoom">
  <button class="btn-map" id="btnSearch" title="Search address">&#128269;</button>
</div>
<div id="mapProjection"></div>
<div id="pdfContainer">
  <div class="pdf-controls">
    <button id="pdfZoomIn" title="Zoom in">+</button>
    <button id="pdfZoomOut" title="Zoom out">−</button>
    <button id="pdfFitWidth" title="Fit width">↔</button>
    <button id="pdfOpenNew" title="Open in new tab">⧉</button>
  </div>
  <iframe id="pdfFrame"></iframe>
</div>
<div class="map-legend" id="mapLegend">
  <h4>Legend</h4>
  <div id="legendContent"></div>
</div>
<div class="map-layers" id="mapLayersPanel">
  <h4>Overlays</h4>
  <div id="layersList"></div>
</div>
<div class="import-overlay" id="importOverlay">
  <h4>Import GeoJSON / KML</h4>
  <input type="file" id="importFile" accept=".geojson,.json,.kml">
  <br>
  <button class="btn-map" id="btnDoImport">Import</button>
  <button class="btn-map" id="btnCancelImport">Cancel</button>
</div>
<!-- Upload map dialog -->
<div class="upload-map-dialog" id="uploadMapDialog">
  <h4>Upload Map File</h4>
  <label>Name</label>
  <input type="text" id="uploadMapName" placeholder="Map name">
  <label>Description</label>
  <input type="text" id="uploadMapDesc" placeholder="Description (optional)">
  <label>Type</label>
  <select id="uploadMapType">
    <option value="geographical">Geographical</option>
    <option value="floor_plan">Floor Plan</option>
    <option value="network">Network</option>
    <option value="electrical">Electrical</option>
    <option value="org_chart">Organisational Chart</option>
    <option value="custom">Custom</option>
  </select>
  <label>File (image, PDF, or GeoJSON)</label>
  <input type="file" id="uploadMapFile" accept=".jpg,.jpeg,.png,.svg,.pdf,.geojson,.json">
  <div class="dialog-buttons">
    <button class="btn-map" id="btnCancelUploadMap">Cancel</button>
    <button class="btn-map" id="btnDoUploadMap">Upload</button>
  </div>
</div>
<!-- New overlay dialog -->
<div class="new-overlay-dialog" id="newOverlayDialog">
  <h4>New Overlay</h4>
  <label>Name</label>
  <input type="text" id="newOverlayName" placeholder="Overlay name">
  <div class="dialog-buttons">
    <button class="btn-map" id="btnCancelNewOverlay">Cancel</button>
    <button class="btn-map" id="btnDoNewOverlay">Create</button>
  </div>
</div>
<!-- Add item dialog -->
<div class="add-item-dialog" id="addItemDialog" style="max-width:420px">
  <h4>Add Item to Overlay</h4>
  <label>Type</label>
  <select id="itemType">
    <option value="user">User</option>
    <option value="group">Group/Team</option>
    <option value="building">Building</option>
    <option value="service">Computer Service</option>
    <option value="custom">Custom</option>
  </select>
  <label>Reference</label>
  <select id="itemRef"><option value="">-- select --</option></select>
  <label>Label</label>
  <input id="itemLabel" placeholder="Label text">
  <label>Color</label>
  <input id="itemColor" type="color" value="#4A90D9">
  <label>Icon</label>
  <input id="itemIcon" placeholder="Emoji or symbol" value="">
  <label style="margin-top:4px">Symbol Set</label>
  <select id="symbolSetPicker" style="margin-bottom:4px">
    <option value="">-- pick from set --</option>
  </select>
  <div id="symbolGrid" style="max-height:120px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:2px;border:1px solid var(--border);border-radius:4px;padding:4px;background:var(--bg3);margin-bottom:4px"></div>
  <label>Notes</label>
  <input id="itemNotes" placeholder="Notes (optional)">
  <div class="dialog-buttons">
    <button class="btn-map" id="btnCancelAddItem">Cancel</button>
    <button class="btn-map" id="btnPlaceItem">Place on Map</button>
  </div>
</div>
<script src="/static/vendor/leaflet.js"></script>
<script src="/static/map-popup.js"></script>
</body>
</html>
