<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidslinjal – Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .reg-form { display: none; }
    .reg-hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
    .login-switch { font-size: 12px; text-align: center; margin-top: 14px; }
    .login-switch a { color: var(--accent); cursor: pointer; text-decoration: none; }
    .login-switch a:hover { text-decoration: underline; }
    .success-msg { display: none; color: #2ECC71; font-size: 13px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="8" fill="#1a3a5c"/>
        <line x1="8" y1="24" x2="40" y2="24" stroke="#4A90D9" stroke-width="2.5"/>
        <circle cx="16" cy="24" r="3" fill="#E74C3C"/>
        <circle cx="24" cy="24" r="3" fill="#2ECC71"/>
        <circle cx="32" cy="24" r="3" fill="#E67E22"/>
        <line x1="8" y1="16" x2="8" y2="32" stroke="#4A90D9" stroke-width="1.5"/>
        <line x1="40" y1="16" x2="40" y2="32" stroke="#4A90D9" stroke-width="1.5"/>
      </svg>
    </div>
    <h1>Tidslinjal</h1>
    <p class="login-subtitle">Collaborative Operational Timeline</p>

    <!-- Login form -->
    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div id="loginError" class="error-msg" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      <div class="login-switch" id="forgotLink">
        <a onclick="showForgot()">Forgot password?</a>
      </div>
    </form>

    <!-- Forgot Password form -->
    <form id="forgotForm" style="display:none">
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px">Enter your username or email address and a reset token will be generated.</p>
      <div class="form-group">
        <label for="forgotUser">Username or Email</label>
        <input type="text" id="forgotUser" autocomplete="username">
      </div>
      <div id="forgotError" class="error-msg" style="display:none"></div>
      <div id="forgotSuccess" class="success-msg"></div>
      <button type="submit" class="btn btn-primary btn-full">Request Reset</button>
      <div class="login-switch"><a onclick="showLogin()">← Back to login</a></div>
    </form>

    <!-- Reset Password form -->
    <form id="resetForm" style="display:none">
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:12px">Enter the reset token and your new password.</p>
      <div class="form-group">
        <label for="resetToken">Reset Token</label>
        <input type="text" id="resetToken" placeholder="Paste token here">
      </div>
      <div class="form-group">
        <label for="resetPwd">New Password</label>
        <input type="password" id="resetPwd" autocomplete="new-password">
      </div>
      <div id="resetError" class="error-msg" style="display:none"></div>
      <div id="resetSuccess" class="success-msg"></div>
      <button type="submit" class="btn btn-primary btn-full">Set New Password</button>
      <div class="login-switch"><a onclick="showLogin()">← Back to login</a></div>
    </form>

    <!-- Registration form -->
    <form id="regForm" class="reg-form">
      <div class="form-group">
        <label for="regUsername">Username *</label>
        <input type="text" id="regUsername" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="regPassword">Password *</label>
        <input type="password" id="regPassword" autocomplete="new-password" required>
      </div>
      <div class="form-group">
        <label for="regDisplay">Display Name</label>
        <input type="text" id="regDisplay" placeholder="How your name appears to others">
      </div>
      <div class="form-group">
        <label for="regEmail">Email (for password reset)</label>
        <input type="email" id="regEmail" autocomplete="email">
      </div>
      <div class="form-group" id="regCodeGroup" style="display:none">
        <label for="regCode">Invitation Code *</label>
        <input type="text" id="regCode">
      </div>
      <div id="regError" class="error-msg" style="display:none"></div>
      <div id="regSuccess" class="success-msg"></div>
      <button type="submit" class="btn btn-primary btn-full">Register</button>
      <div class="login-switch"><a onclick="showLogin()">← Back to login</a></div>
    </form>

    <!-- SSO / OIDC button — shown dynamically if OIDC is configured -->
    <div id="oidcSection" style="display:none;margin-top:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,0.15)">
        <span style="font-size:12px;opacity:0.5">or</span>
        <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,0.15)">
      </div>
      <a href="/auth/oidc/login" class="btn btn-secondary btn-full" style="text-align:center;display:block;text-decoration:none">
        🔐 Sign in with SSO
      </a>
    </div>

    <!-- Register link — shown dynamically if registration is enabled -->
    <div id="registerSection" style="display:none;margin-top:12px;text-align:center;font-size:13px">
      <a onclick="showRegister()" style="color:var(--accent);cursor:pointer;text-decoration:none">
        Don't have an account? Register
      </a>
    </div>

    <div id="loginUrlError" style="display:none;font-size:12px;color:#E74C3C;margin-top:8px;text-align:center"></div>
  </div>

  <script>
    'use strict';

    let regMode = 'off';

    function showLogin() {
      document.getElementById('loginForm').style.display = '';
      document.getElementById('regForm').style.display = 'none';
      document.getElementById('forgotForm').style.display = 'none';
      document.getElementById('resetForm').style.display = 'none';
    }

    function showRegister() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('regForm').style.display = '';
      document.getElementById('forgotForm').style.display = 'none';
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('regCodeGroup').style.display =
        (regMode === 'generic_invitation' || regMode === 'personal_invitation') ? '' : 'none';
    }

    function showForgot() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('regForm').style.display = 'none';
      document.getElementById('forgotForm').style.display = '';
      document.getElementById('resetForm').style.display = 'none';
    }

    // Show error from URL query param if OIDC callback failed
    const urlParams = new URLSearchParams(location.search);
    const urlError = urlParams.get('error');
    if (urlError) {
      const errDiv = document.getElementById('loginUrlError');
      errDiv.textContent = 'SSO error: ' + decodeURIComponent(urlError).replace(/_/g, ' ');
      errDiv.style.display = 'block';
    }

    // Show reset form if token in URL
    const resetToken = urlParams.get('reset');
    if (resetToken) {
      document.getElementById('resetToken').value = resetToken;
      showLogin(); // will be overridden
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('resetForm').style.display = '';
    }

    // Check if OIDC is configured and show SSO button; in exclusive mode hide local form
    fetch('/api/auth/oidc-config').then(async r => {
      if (!r.ok) return;
      document.getElementById('oidcSection').style.display = '';
      const cfg = await r.json();
      if (cfg.exclusive === 'true') {
        // Hide local login form; SSO is the only option
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('forgotLink').style.display = 'none';
        // Auto-redirect to SSO if no error in URL
        if (!urlError && !resetToken) {
          window.location.href = '/auth/oidc/login';
        }
      }
    }).catch(() => {});

    // Check if registration is enabled
    fetch('/api/auth/register', {method: 'OPTIONS'}).catch(() => {});
    // Determine registration mode via public endpoint
    fetch('/api/admin/registration').then(async r => {
      if (r.ok) {
        const data = await r.json();
        regMode = data.mode || 'off';
        if (regMode !== 'off') {
          document.getElementById('registerSection').style.display = '';
        }
      }
    }).catch(() => {});

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          if (res.status === 403 && data.error === 'account pending approval') {
            errEl.textContent = 'Your account is pending admin approval. Please try again later.';
          } else {
            errEl.textContent = data.error || 'Login failed';
          }
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Network error';
        errEl.style.display = 'block';
      }
    });

    // Register
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('regError');
      const succEl = document.getElementById('regSuccess');
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      const body = {
        username: document.getElementById('regUsername').value.trim(),
        password: document.getElementById('regPassword').value,
        display_name: document.getElementById('regDisplay').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        invitation_code: document.getElementById('regCode').value.trim(),
      };

      if (!body.username || !body.password) {
        errEl.textContent = 'Username and password are required.';
        errEl.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (res.ok) {
          if (data.vetted) {
            succEl.textContent = 'Registration successful! You can now log in.';
          } else {
            succEl.textContent = 'Registration submitted. An admin will review your account before you can log in.';
          }
          succEl.style.display = 'block';
          document.getElementById('regForm').reset();
        } else {
          errEl.textContent = data.error || 'Registration failed';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Network error';
        errEl.style.display = 'block';
      }
    });

    // Forgot Password
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('forgotError');
      const succEl = document.getElementById('forgotSuccess');
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      const val = document.getElementById('forgotUser').value.trim();
      if (!val) { errEl.textContent = 'Please enter your username or email.'; errEl.style.display = 'block'; return; }

      const body = val.includes('@') ? {email: val} : {username: val};

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (res.ok) {
          if (data.token) {
            // Show token inline (no email server configured)
            succEl.innerHTML = `Reset token generated. Please send this to the user:<br>
              <code style="word-break:break-all;font-size:11px">${data.token}</code><br>
              <small>They can use it at <a onclick="document.getElementById('resetToken').value='${data.token}';showLogin();document.getElementById('loginForm').style.display='none';document.getElementById('resetForm').style.display=''" style="cursor:pointer;color:var(--accent)">Reset password</a></small>`;
          } else {
            succEl.textContent = 'If the account exists, a reset link has been sent.';
          }
          succEl.style.display = 'block';
        } else {
          errEl.textContent = data.error || 'Request failed';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Network error';
        errEl.style.display = 'block';
      }
    });

    // Reset Password
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('resetError');
      const succEl = document.getElementById('resetSuccess');
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      const token = document.getElementById('resetToken').value.trim();
      const newPwd = document.getElementById('resetPwd').value;
      if (!token || !newPwd) { errEl.textContent = 'Token and password are required.'; errEl.style.display = 'block'; return; }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token, new_password: newPwd})
        });
        const data = await res.json();
        if (res.ok) {
          succEl.textContent = 'Password changed successfully. You can now log in.';
          succEl.style.display = 'block';
          setTimeout(showLogin, 2000);
        } else {
          errEl.textContent = data.error || 'Reset failed';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Network error';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
