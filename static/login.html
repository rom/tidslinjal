<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidslinjal – Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="8" fill="#1a3a5c"/>
        <line x1="8" y1="24" x2="40" y2="24" stroke="#4A90D9" stroke-width="2.5"/>
        <circle cx="16" cy="24" r="3" fill="#E74C3C"/>
        <circle cx="24" cy="24" r="3" fill="#2ECC71"/>
        <circle cx="32" cy="24" r="3" fill="#E67E22"/>
        <line x1="8" y1="16" x2="8" y2="32" stroke="#4A90D9" stroke-width="1.5"/>
        <line x1="40" y1="16" x2="40" y2="32" stroke="#4A90D9" stroke-width="1.5"/>
      </svg>
    </div>
    <h1>Tidslinjal</h1>
    <p class="login-subtitle">Collaborative Operational Timeline</p>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <div id="loginError" class="error-msg" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-full">Sign In</button>
    </form>

    <!-- SSO / OIDC button — shown dynamically if OIDC is configured -->
    <div id="oidcSection" style="display:none;margin-top:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,0.15)">
        <span style="font-size:12px;opacity:0.5">or</span>
        <hr style="flex:1;border:none;border-top:1px solid rgba(255,255,255,0.15)">
      </div>
      <a href="/auth/oidc/login" class="btn btn-secondary btn-full" style="text-align:center;display:block;text-decoration:none">
        🔐 Sign in with SSO
      </a>
    </div>

    <div id="loginUrlError" style="display:none;font-size:12px;color:#E74C3C;margin-top:8px;text-align:center"></div>
  </div>

  <script>
    // Show error from URL query param if OIDC callback failed
    const urlError = new URLSearchParams(location.search).get('error');
    if (urlError) {
      const errDiv = document.getElementById('loginUrlError');
      errDiv.textContent = 'SSO error: ' + decodeURIComponent(urlError).replace(/_/g, ' ');
      errDiv.style.display = 'block';
    }

    // Check if OIDC is configured and show SSO button
    fetch('/api/auth/oidc-config').then(r => {
      if (r.ok) document.getElementById('oidcSection').style.display = '';
    }).catch(() => {});

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json();
          errEl.textContent = data.error || 'Login failed';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Network error';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
