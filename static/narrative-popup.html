<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidslinjal — Narrative</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16" type="image/x-icon">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<style>
body.theme-dark  { --bg:#1a1d23; --bg2:#22262e; --bg3:#2a2e38; --text:#e8eaf0; --text-dim:#9098b0; --accent:#4a9eff; --border:#2e3340; --danger:#e05252; }
body.theme-light { --bg:#f0f2f5; --bg2:#ffffff; --bg3:#e8eaf0; --text:#1a1d23; --text-dim:#666; --accent:#1a6ed8; --border:#d0d4de; --danger:#c0392b; }
body.theme-city-camo { --bg:#2b3325; --bg2:#333d2c; --bg3:#3a4532; --text:#d4dbc0; --text-dim:#8d9a78; --accent:#8fb85c; --border:#404d34; --danger:#e05252; }
body.theme-urban-camo { --bg:#1a2233; --bg2:#1e293b; --bg3:#243044; --text:#c8d8e8; --text-dim:#7a90a8; --accent:#4a90d9; --border:#3a4a5c; --danger:#e05252; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
  display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.nr-toolbar { display:flex; align-items:center; gap:8px; background:var(--bg2);
  border-bottom:1px solid var(--border); padding:8px 12px; flex-shrink:0; }
.nr-toolbar .page-header { font-size:11px; color:var(--text-dim); letter-spacing:.12em; text-transform:uppercase; }
.nr-toolbar .btn { background:var(--bg3); border:1px solid var(--border); border-radius:5px; color:var(--text);
  padding:4px 10px; font-size:11px; cursor:pointer; }
.nr-toolbar .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.nr-filters { display:flex; align-items:center; gap:8px; background:var(--bg2);
  border-bottom:1px solid var(--border); padding:8px 12px; flex-shrink:0; flex-wrap:wrap; }
.nr-filters label { font-size:11px; color:var(--text-dim); display:flex; align-items:center; gap:4px; }
.nr-filters input[type="datetime-local"],
.nr-filters select { background:var(--bg); border:1px solid var(--border); border-radius:5px;
  color:var(--text); padding:4px 6px; font-size:11px; }
.nr-filters input[type="checkbox"] { accent-color:var(--accent); }
.nr-content { flex:1; overflow-y:auto; padding:12px; font-family:'Cascadia Code','Fira Code','Consolas',monospace; font-size:12px; }
.nr-entry { padding:6px 0; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:flex-start; }
.nr-entry-time { font-weight:700; min-width:80px; white-space:nowrap; }
.nr-entry-icon { font-size:14px; }
.nr-entry-body { flex:1; }
.nr-entry-user { color:var(--text-dim); margin-left:6px; }
.nr-empty { color:var(--text-dim); padding:20px; text-align:center; }
</style>
</head>
<body class="theme-dark">
<div class="nr-toolbar">
  <span class="page-header" id="nrHeaderTitle">📰 Tidslinjal — Narrative</span>
  <span style="flex:1"></span>
  <button class="btn" id="btnToolbarRefresh" title="Refresh">🔄 <span id="lblRefresh">Refresh</span></button>
</div>
<div class="nr-filters">
  <label>
    <span id="lblFrom">From</span>:
    <input type="datetime-local" id="nrFrom">
  </label>
  <label>
    <span id="lblTo">To</span>:
    <input type="datetime-local" id="nrTo">
  </label>
  <label>
    <span id="lblDetail">Detail level</span>:
    <select id="nrCategory">
      <option value="all">All events</option>
      <option value="external">External events</option>
      <option value="operational">Operational events</option>
      <option value="security">Security events</option>
    </select>
  </label>
  <label>
    <input type="checkbox" id="nrAutoscroll" checked>
    <span id="lblAutoscroll">Autoscroll</span>
  </label>
  <label>
    <span id="lblSortOrder">Order</span>:
    <select id="nrSortOrder">
      <option value="newest" id="optNewest" selected>Newest first</option>
      <option value="oldest" id="optOldest">Oldest first</option>
    </select>
  </label>
  <button class="btn" id="btnFilterRefresh">🔄 <span id="lblRefresh2">Refresh</span></button>
</div>
<div class="nr-content" id="narrativeEntries"></div>
<script src="/static/narrative-popup.js"></script>
</body>
</html>
