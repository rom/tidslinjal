<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidslinjal — Narrative</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16" type="image/x-icon">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<style>
body.theme-dark  { --bg:#1a1d23; --bg2:#22262e; --bg3:#2a2e38; --text:#e8eaf0; --text-dim:#9098b0; --accent:#4a9eff; --border:#2e3340; --danger:#e05252; }
body.theme-light { --bg:#f0f2f5; --bg2:#ffffff; --bg3:#e8eaf0; --text:#1a1d23; --text-dim:#666; --accent:#1a6ed8; --border:#d0d4de; --danger:#c0392b; }
body.theme-city-camo { --bg:#2b3325; --bg2:#333d2c; --bg3:#3a4532; --text:#d4dbc0; --text-dim:#8d9a78; --accent:#8fb85c; --border:#404d34; --danger:#e05252; }
body.theme-urban-camo { --bg:#212630; --bg2:#282e3a; --bg3:#2f3644; --text:#c8d0e0; --text-dim:#7a88a0; --accent:#5c8abf; --border:#333d50; --danger:#e05252; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
  display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.nr-toolbar { display:flex; align-items:center; gap:8px; background:var(--bg2);
  border-bottom:1px solid var(--border); padding:8px 12px; flex-shrink:0; }
.nr-toolbar .page-header { font-size:11px; color:var(--text-dim); letter-spacing:.12em; text-transform:uppercase; }
.nr-toolbar .btn { background:var(--bg3); border:1px solid var(--border); border-radius:5px; color:var(--text);
  padding:4px 10px; font-size:11px; cursor:pointer; }
.nr-toolbar .btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.nr-filters { display:flex; align-items:center; gap:8px; background:var(--bg2);
  border-bottom:1px solid var(--border); padding:8px 12px; flex-shrink:0; flex-wrap:wrap; }
.nr-filters label { font-size:11px; color:var(--text-dim); display:flex; align-items:center; gap:4px; }
.nr-filters input[type="datetime-local"],
.nr-filters select { background:var(--bg); border:1px solid var(--border); border-radius:5px;
  color:var(--text); padding:4px 6px; font-size:11px; }
.nr-filters input[type="checkbox"] { accent-color:var(--accent); }
.nr-content { flex:1; overflow-y:auto; padding:12px; font-family:'Cascadia Code','Fira Code','Consolas',monospace; font-size:12px; }
.nr-entry { padding:6px 0; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:flex-start; }
.nr-entry-time { font-weight:700; min-width:42px; }
.nr-entry-icon { font-size:14px; }
.nr-entry-body { flex:1; }
.nr-entry-user { color:var(--text-dim); margin-left:6px; }
.nr-empty { color:var(--text-dim); padding:20px; text-align:center; }
</style>
</head>
<body class="theme-dark">
<div class="nr-toolbar">
  <span class="page-header" id="nrHeaderTitle">📰 Tidslinjal — Narrative</span>
  <span style="flex:1"></span>
  <button class="btn" id="btnToolbarRefresh" title="Refresh">🔄 <span id="lblRefresh">Refresh</span></button>
</div>
<div class="nr-filters">
  <label>
    <span id="lblFrom">From</span>:
    <input type="datetime-local" id="nrFrom">
  </label>
  <label>
    <span id="lblTo">To</span>:
    <input type="datetime-local" id="nrTo">
  </label>
  <label>
    <span id="lblDetail">Detail level</span>:
    <select id="nrCategory">
      <option value="all">All events</option>
      <option value="external">External events</option>
      <option value="operational">Operational events</option>
      <option value="security">Security events</option>
    </select>
  </label>
  <label>
    <input type="checkbox" id="nrAutoscroll" checked>
    <span id="lblAutoscroll">Autoscroll</span>
  </label>
  <button class="btn" id="btnFilterRefresh">🔄 <span id="lblRefresh2">Refresh</span></button>
</div>
<div class="nr-content" id="narrativeEntries"></div>
<script>
'use strict';
const opener = window.opener;
let _t = {};

const typeIcons = {
  event_started: '📌', decision_requested: '❓', decision_approved: '✅',
  decision_rejected: '❌', decision_: '⚖', audit_created: '➕',
  audit_updated: '✏', audit_deleted: '🗑', audit_status_changed: '🔄',
  audit_login: '🔑', audit_co_signed: '👁',
};
const severityColors = {info:'var(--text-dim)', warning:'#E67E22', critical:'#E74C3C'};

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function t(key) {
  return _t[key] || key;
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined && !(body instanceof FormData)) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  } else if (body instanceof FormData) {
    opts.body = body;
  }
  const res = await fetch(path, opts);
  if (res.status === 401) { window.location.href = '/login'; throw new Error('unauth'); }
  return res;
}

function getOpener() {
  try { return window.opener && !window.opener.closed ? window.opener : null; } catch(e) { return null; }
}

function initFromOpener() {
  var op = getOpener();
  if (!op || !op.state) return false;
  try {
    const s = op.state;
    if (op.TRANSLATIONS) {
      const lang = s.preferences?.language || 'en';
      _t = op.TRANSLATIONS[lang] || op.TRANSLATIONS.en || {};
    }
    const theme = s.preferences?.theme || 'dark';
    document.body.className = 'theme-' + theme;
    return true;
  } catch(e) {
    return false;
  }
}

async function initFromAPI() {
  try {
    const res = await fetch('/api/auth/me');
    if (!res.ok) return false;
    const prefRes = await fetch('/api/preferences').catch(() => null);
    if (prefRes && prefRes.ok) {
      const prefs = await prefRes.json();
      if (prefs) {
        const theme = prefs.theme || 'dark';
        document.body.className = 'theme-' + theme;
        const lang = prefs.language || 'en';
        if (typeof TRANSLATIONS !== 'undefined') {
          _t = TRANSLATIONS[lang] || TRANSLATIONS.en || {};
        }
      }
    }
    return true;
  } catch { return false; }
}

function _loadI18nScript() {
  return new Promise(function(resolve) {
    if (typeof TRANSLATIONS !== 'undefined') { resolve(); return; }
    var s = document.createElement('script');
    s.src = '/static/i18n.js';
    s.onload = resolve;
    s.onerror = resolve;
    document.head.appendChild(s);
  });
}

function applyI18n() {
  const el = (id, key, fallback) => {
    const e = document.getElementById(id);
    if (e) e.textContent = _t[key] || fallback || key;
  };
  el('nrHeaderTitle', 'narrative_title', '📰 Tidslinjal — Narrative');
  const hdr = document.getElementById('nrHeaderTitle');
  if (hdr && _t.narrative_title) hdr.textContent = '📰 Tidslinjal — ' + _t.narrative_title;
  el('lblRefresh', 'btn_refresh', 'Refresh');
  el('lblRefresh2', 'btn_refresh', 'Refresh');
  el('lblFrom', 'from', 'From');
  el('lblTo', 'to', 'To');
  el('lblDetail', 'detail_level', 'Detail level');
  el('lblAutoscroll', 'autoscroll', 'Autoscroll');
}

// Set default date range (last 24h)
function initDateRange() {
  const now = new Date();
  const from = new Date(now.getTime() - 24*60*60*1000);
  document.getElementById('nrFrom').value = from.toISOString().slice(0,16);
  document.getElementById('nrTo').value = now.toISOString().slice(0,16);
}

async function loadEntries() {
  const fromEl = document.getElementById('nrFrom');
  const toEl = document.getElementById('nrTo');
  const catEl = document.getElementById('nrCategory');
  const from = fromEl.value ? new Date(fromEl.value).toISOString() : new Date(Date.now()-24*60*60*1000).toISOString();
  const to = toEl.value ? new Date(toEl.value).toISOString() : new Date().toISOString();
  const category = catEl.value || 'all';
  let url = '/api/narrative?from=' + encodeURIComponent(from) + '&to=' + encodeURIComponent(to) + '&limit=200';
  if (category !== 'all') url += '&category=' + encodeURIComponent(category);
  try {
    const res = await api('GET', url);
    if (res.ok) {
      const entries = await res.json() || [];
      render(entries);
    }
  } catch(e) {
    console.warn('Narrative fetch error', e);
  }
}

function render(entries) {
  const el = document.getElementById('narrativeEntries');
  if (!entries || !entries.length) {
    el.innerHTML = '<div class="nr-empty">' + escHtml(_t.narrative_empty || 'No events in this time range.') + '</div>';
    return;
  }
  el.innerHTML = entries.map(e => {
    const timeStr = new Date(e.timestamp).toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
    const severityColor = severityColors[e.severity] || 'var(--text-dim)';
    let icon = '•';
    for (const [prefix, ic] of Object.entries(typeIcons)) {
      if (e.type && e.type.startsWith(prefix)) { icon = ic; break; }
    }
    return '<div class="nr-entry">' +
      '<span class="nr-entry-time" style="color:' + severityColor + '">' + timeStr + '</span>' +
      '<span class="nr-entry-icon">' + icon + '</span>' +
      '<div class="nr-entry-body">' +
        '<span style="color:var(--text)">' + escHtml(e.summary || '') + '</span>' +
        (e.user_name ? '<span class="nr-entry-user">— ' + escHtml(e.user_name) + '</span>' : '') +
      '</div>' +
    '</div>';
  }).join('');

  // Autoscroll
  if (document.getElementById('nrAutoscroll').checked) {
    el.scrollTop = el.scrollHeight;
  }
}

// Bind refresh buttons
document.getElementById('btnToolbarRefresh').onclick = loadEntries;
document.getElementById('btnFilterRefresh').onclick = loadEntries;

// Listen for theme changes from parent
window.addEventListener('message', function(e) {
  if (e.data && e.data.type === 'theme') {
    document.body.className = 'theme-' + (e.data.theme || 'dark');
  }
});

// BroadcastChannel theme sync (works even if opener is lost)
try {
  var _nrBC = new BroadcastChannel('tidslinjal-sync');
  _nrBC.onmessage = function(e) {
    if (e.data && e.data.type === 'theme') {
      document.body.className = 'theme-' + (e.data.theme || 'dark');
    }
  };
} catch(e) {}

// Auto-refresh every 10 seconds
setInterval(loadEntries, 10000);

// Periodic theme sync from opener
setInterval(function() {
  var op = getOpener();
  if (op && op.state && op.state.preferences) {
    var theme = op.state.preferences.theme || 'dark';
    if (document.body.className !== 'theme-' + theme) {
      document.body.className = 'theme-' + theme;
    }
  }
}, 3000);

// SSE: listen for relevant events and re-fetch
try {
  var _nrSSE = new EventSource('/api/events');
  _nrSSE.onmessage = function(ev) {
    try {
      var data = JSON.parse(ev.data);
      if (data.type && (
        data.type.startsWith('event_') ||
        data.type.startsWith('decision_') ||
        data.type.startsWith('audit_') ||
        data.type === 'narrative_update' ||
        data.type === 'refresh'
      )) {
        loadEntries();
      }
    } catch(e) {}
  };
  _nrSSE.onerror = function() {
    // EventSource will auto-reconnect
  };
} catch(e) {}

// Init: try opener first, always fall back to API for auth if needed
(async () => {
  initDateRange();
  var gotOpener = initFromOpener();
  if (!gotOpener) {
    await _loadI18nScript();
    await initFromAPI();
  }
  applyI18n();
  loadEntries();
})();
</script>
</body>
</html>
