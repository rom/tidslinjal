<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tidslinjal — Analysis</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16" type="image/x-icon">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<style>
body.theme-dark  { --bg:#0f1923; --bg2:#162030; --bg3:#1e2d40; --text:#cfd8e3; --text-dim:#7a8fa6; --text-bright:#f0f4f8; --accent:#4A90D9; --accent2:#2a6fad; --border:#2a3f56; --red:#E74C3C; --green:#2ECC71; --orange:#E67E22; --radius:6px; --fs-sm:11px; --fs-xs:10px; }
body.theme-light { --bg:#f0f4f8; --bg2:#ffffff; --bg3:#e4eaf2; --text:#2c3e50; --text-dim:#5f7a99; --text-bright:#0a1929; --accent:#2a6fad; --accent2:#1a5490; --border:#c4d0de; --red:#E74C3C; --green:#2ECC71; --orange:#E67E22; --radius:6px; --fs-sm:11px; --fs-xs:10px; }
body.theme-city-camo { --bg:#3a3d2e; --bg2:#4a4d38; --bg3:#555847; --text:#d4d8c4; --text-dim:#9a9e8a; --text-bright:#eef0e0; --accent:#8faa5a; --accent2:#6d8440; --border:#6b6e58; --red:#c0392b; --green:#7fb069; --orange:#c68642; --radius:6px; --fs-sm:11px; --fs-xs:10px; }
body.theme-urban-camo { --bg:#151a24; --bg2:#1a2030; --bg3:#243044; --text:#c0cee0; --text-dim:#7a90a8; --text-bright:#e8f0f8; --accent:#4a90d9; --accent2:#2e70b8; --border:#2e4060; --red:#E74C3C; --green:#2ECC71; --orange:#E67E22; --radius:6px; --fs-sm:11px; --fs-xs:10px; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
  display:flex; flex-direction:column; height:100vh; overflow:hidden; }
.anl-toolbar { display:flex; align-items:center; gap:8px; background:var(--bg2);
  border-bottom:1px solid var(--border); padding:8px 12px; flex-shrink:0; flex-wrap:wrap; }
.anl-toolbar .page-header { font-size:11px; color:var(--text-dim); letter-spacing:.12em; text-transform:uppercase; }
.btn { background:var(--bg3); border:1px solid var(--border); border-radius:5px; color:var(--text);
  padding:4px 10px; font-size:11px; cursor:pointer; }
.btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.anl-tabs { display:flex; gap:0; }
.anl-tabs .btn { border-radius:var(--radius) var(--radius) 0 0; font-size:11px; padding:4px 10px; }
.anl-content { flex:1; overflow-y:auto; padding:12px; }
.anl-card { padding:12px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); text-align:center; }
.anl-card-value { font-size:24px; font-weight:700; }
.anl-card-label { font-size:var(--fs-xs); color:var(--text); }
.anl-section { margin-bottom:16px; padding:12px; background:var(--bg3); border-radius:var(--radius); }
.anl-section-title { font-weight:700; margin-bottom:8px; font-size:var(--fs-sm); }
.anl-grid { display:grid; gap:8px; margin-bottom:16px; }
.anl-grid-3 { grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
.anl-grid-6 { grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
.anl-grid-2 { grid-template-columns:1fr 1fr; }
.anl-empty { color:var(--text-dim); padding:20px; text-align:center; }
input[type="date"] { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); padding:3px 6px; font-size:var(--fs-xs); }
</style>
</head>
<body class="theme-dark">
<div class="anl-toolbar">
  <span class="page-header" id="anlHeaderTitle">📈 Tidslinjal — Analysis</span>
  <span style="flex:1"></span>
  <label style="font-size:var(--fs-xs);display:flex;align-items:center;gap:4px">
    <span id="lblName">Name</span>: <input type="text" id="anlName" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:3px 6px;font-size:var(--fs-xs);width:140px">
  </label>
  <label style="font-size:var(--fs-xs);display:flex;align-items:center;gap:4px">
    <span id="lblFrom">From</span>: <input type="date" id="anlFrom">
  </label>
  <label style="font-size:var(--fs-xs);display:flex;align-items:center;gap:4px">
    <span id="lblTo">To</span>: <input type="date" id="anlTo">
  </label>
  <button class="btn" id="btnRefresh">🔄 <span id="lblRefresh">Refresh</span></button>
  <div class="anl-tabs" id="anlTabBar">
    <button class="btn active" data-tab="overview">Overview</button>
    <button class="btn" data-tab="activity">Activity</button>
    <button class="btn" data-tab="optempo">OpTempo</button>
    <button class="btn" data-tab="decisions">Decisions</button>
    <button class="btn" data-tab="dependencies">Dependencies</button>
    <button class="btn" data-tab="leadership">Leadership</button>
    <button class="btn" data-tab="jstaff">J-Staff</button>
    <button class="btn" data-tab="teamleads">TeamLeads</button>
    <button class="btn" data-tab="opsleads">OpsLeads</button>
    <button class="btn" data-tab="teammembers">Team Members</button>
    <button class="btn" data-tab="usage">System Usage</button>
    <button class="btn" data-tab="export">Export</button>
  </div>
</div>
<div class="anl-content" id="anlContent">
  <div class="anl-empty">Loading...</div>
</div>
<script src="/static/i18n.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/analysis-popup-app.js"></script>
</body>
</html>
