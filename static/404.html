<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Tidslinjal</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16" type="image/x-icon">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1d23; color: #e8eaf0;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; text-align: center; padding: 24px;
}
.container { max-width: 520px; }
.code {
  font-size: 120px; font-weight: 800; letter-spacing: -4px;
  background: linear-gradient(135deg, #4a9eff 0%, #2563eb 50%, #1e40af 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; line-height: 1; margin-bottom: 12px;
}
.timeline-bar {
  display: flex; align-items: center; gap: 4px;
  justify-content: center; margin: 20px 0 24px;
}
.timeline-bar .dot {
  width: 10px; height: 10px; border-radius: 50%;
  animation: pulse 2s ease-in-out infinite;
}
.timeline-bar .line {
  width: 40px; height: 3px; border-radius: 2px; background: #2e3340;
}
.timeline-bar .dot:nth-child(1) { background: #4a9eff; animation-delay: 0s; }
.timeline-bar .dot:nth-child(3) { background: #e05252; animation-delay: 0.3s; }
.timeline-bar .dot:nth-child(5) { background: #f0ad4e; animation-delay: 0.6s; }
.timeline-bar .dot:nth-child(7) { background: #27ae60; animation-delay: 0.9s; }
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.4); opacity: 1; }
}
h1 { font-size: 22px; margin-bottom: 8px; color: #e8eaf0; font-weight: 600; }
p { color: #9098b0; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
.btn {
  display: inline-block; padding: 10px 28px;
  background: #4a9eff; color: #fff; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
  text-decoration: none; transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: #2563eb; transform: translateY(-1px); }
.brand {
  margin-top: 32px; font-size: 11px; letter-spacing: 0.15em;
  text-transform: uppercase; color: #4a5568;
}
</style>
</head>
<body>
<div class="container">
  <div class="code">404</div>
  <div class="timeline-bar">
    <span class="dot"></span><span class="line"></span>
    <span class="dot"></span><span class="line"></span>
    <span class="dot"></span><span class="line"></span>
    <span class="dot"></span>
  </div>
  <h1>Off the Timeline</h1>
  <p>
    The page you're looking for doesn't exist on this timeline.
    It may have been moved, deleted, or never created.
  </p>
  <a class="btn" href="/">Back to Timeline</a>
  <div class="brand">Tidslinjal — Collaborative Operational Timeline</div>
</div>
</body>
</html>
