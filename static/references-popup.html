<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tidslinjal — References</title>
<link rel="icon" href="/static/favicon.ico" sizes="16x16" type="image/x-icon">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<style>
body.theme-dark  { --bg:#1a1d23; --bg2:#22262e; --bg3:#2a2e38; --text:#e8eaf0; --text-dim:#9098b0; --accent:#4a9eff; --border:#2e3340; --danger:#e05252; --red:#e74c3c; --green:#27ae60; }
body.theme-light { --bg:#f0f2f5; --bg2:#ffffff; --bg3:#e8eaf0; --text:#1a1d23; --text-dim:#666; --accent:#1a6ed8; --border:#d0d4de; --danger:#c0392b; --red:#c0392b; --green:#27ae60; }
body.theme-city-camo { --bg:#2b3325; --bg2:#333d2c; --bg3:#3a4532; --text:#d4dbc0; --text-dim:#8d9a78; --accent:#8fb85c; --border:#404d34; --danger:#e05252; --red:#e05252; --green:#27ae60; }
body.theme-urban-camo { --bg:#1a2233; --bg2:#1e293b; --bg3:#243044; --text:#c8d8e8; --text-dim:#7a90a8; --accent:#4a90d9; --border:#3a4a5c; --danger:#e05252; --red:#e05252; --green:#27ae60; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
.top-bar { display:flex; align-items:center; gap:8px; padding:6px 12px; background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0; }
.top-bar .title { font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.05em; flex:1; }
.top-bar button { background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:4px 12px; cursor:pointer; font-size:12px; }
.top-bar button:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.top-bar input, .top-bar select { background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:4px 8px; font-size:12px; }
.ref-content { flex:1; overflow-y:auto; padding:12px; }
.ref-card { background:var(--bg3); border:1px solid var(--border); border-radius:6px; padding:10px; margin-bottom:6px; }
.ref-card:hover { border-color:var(--accent); }
.ref-tag { display:inline-block; padding:1px 5px; border-radius:3px; font-size:9px; background:var(--bg2); border:1px solid var(--border); margin-right:3px; }
.ref-cat { display:inline-block; padding:1px 6px; border-radius:3px; font-size:9px; color:#fff; text-transform:uppercase; margin-right:6px; }
.btn { background:var(--bg3); border:1px solid var(--border); border-radius:5px; color:var(--text); padding:3px 8px; font-size:11px; cursor:pointer; }
.btn:hover { background:var(--accent); color:#fff; border-color:var(--accent); }
.ref-empty { text-align:center; padding:32px 16px; color:var(--text-dim); font-size:13px; }
.ref-git-bar { display:flex; gap:6px; padding:6px 12px; background:var(--bg2); border-bottom:1px solid var(--border); align-items:center; font-size:11px; }
</style>
</head>
<body class="theme-dark">
<div class="top-bar">
  <span class="title" id="refTitle">📚 References</span>
  <input type="text" id="refSearch" placeholder="Search..." style="width:160px">
  <select id="refCatFilter">
    <option value="">All categories</option>
    <option value="handbook">Handbook</option>
    <option value="sop">SOP</option>
    <option value="policy">Policy</option>
    <option value="map">Map</option>
    <option value="reference">Reference</option>
    <option value="checklist">Checklist</option>
    <option value="faq">FAQ</option>
    <option value="objectives">Objectives</option>
    <option value="other">Other</option>
  </select>
  <select id="refLangFilter">
    <option value="">All languages</option>
  </select>
  <button id="btnRefresh">🔄 Refresh</button>
</div>
<div id="gitBar" class="ref-git-bar" style="display:none">
  <span>GitHub:</span>
  <button id="btnGitSave" class="btn">💾 Save to Git</button>
  <button id="btnGitLoad" class="btn">📥 Load from Git</button>
  <span id="gitStatus" style="color:var(--text-dim);margin-left:auto"></span>
</div>
<div id="refInfoBar" style="padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim)"></div>
<div class="ref-content" id="refContent"></div>
<script src="/static/popup-offline.js"></script>
<script src="/static/references-popup.js"></script>
</body>
</html>
